name: "Build iOS IPA (Unsigned)"

on:
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: bundle exec pod install
        working-directory: ./ios

      - name: Archive app (unsigned release)
        run: |
          xcodebuild archive \
            -workspace CO3.xcworkspace \
            -scheme CO3 \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/CO3.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
        working-directory: ./ios

      - name: Package .app into IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/CO3.xcarchive/Products/Applications" -name "*.app" | head -n 1)
          echo "Packaging: $APP_PATH"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/CO3.ipa" Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CO3-${{ github.sha }}
          path: CO3.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: CO3.ipa
