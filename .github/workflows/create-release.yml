name: Create Release Tag
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag name (e.g., B1.2.3)'
        required: true

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate versionCode
        id: version
        run: |
          RELEASE_COUNT=$(git tag --list 'B*' | wc -l)
          echo "versionCode=$RELEASE_COUNT" >> $GITHUB_OUTPUT
          echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Update build.gradle
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.versionCode }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.tag }}\"/" android/app/build.gradle

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle
          git commit -m "Update version to ${{ steps.version.outputs.tag }} [skip actions]"
          git tag ${{ steps.version.outputs.tag }}
          git push origin HEAD:main
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger iOS build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-build.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "release_tag": "${{ steps.version.outputs.tag }}"
              }
            }'

      - name: Trigger Android build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-build.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "release_tag": "${{ steps.version.outputs.tag }}"
              }
            }'