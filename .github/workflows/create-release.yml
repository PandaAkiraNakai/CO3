name: Auto Increment Version on Tag

on:
  push:
    tags:
      - 'B*'

# Prevent infinite loops when we force-push the recreated tag
jobs:
  increment-version:
    if: "!contains(github.event.head_commit.message, '[skip-version]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag and calculate versionCode
        id: version
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          RELEASE_COUNT=$(git tag --list 'B*' | wc -l)
          echo "versionCode=$RELEASE_COUNT" >> $GITHUB_OUTPUT
          echo "📱 Tag: $TAG | versionCode: $RELEASE_COUNT"

      - name: Update build.gradle
        run: |
          set -e
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.versionCode }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.tag }}\"/" android/app/build.gradle
          echo "✅ Updated build.gradle:"
          grep "versionCode\|versionName" android/app/build.gradle | head -2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Amend tag with updated build.gradle
        run: |
          set -e
          git add android/app/build.gradle
          # Amend the commit that the tag points to, adding [skip-version] to message
          git commit --amend -m "Update version ${{ steps.version.outputs.tag }} [skip-version]"
          # Delete the old tag and recreate it on the amended commit
          git tag -d ${{ steps.version.outputs.tag }}
          git tag ${{ steps.version.outputs.tag }}
          # Force push the amended commit and updated tag
          git push origin HEAD:main --force
          git push origin ${{ steps.version.outputs.tag }} --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub App token
        id: bot_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Trigger iOS build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ steps.bot_token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/ios-build.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "release_tag": "${{ steps.version.outputs.tag }}"
              }
            }'

      - name: Trigger Android build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ steps.bot_token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-build.yml/dispatches \
            -d '{
              "ref": "main",
              "inputs": {
                "release_tag": "${{ steps.version.outputs.tag }}"
              }
            }'