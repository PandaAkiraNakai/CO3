apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// --- ABI config driven by BUILD_ABI env var ---
// Usage:
//   BUILD_ABI=universal          -> single universal APK
//   BUILD_ABI=arm64-v8a          -> arm64 only
//   BUILD_ABI=armeabi-v7a        -> armv7 only
//   BUILD_ABI=x86                -> x86 only
//   BUILD_ABI=x86_64             -> x86_64 only
//   BUILD_ABI=arm64-v8a,x86_64   -> multiple specific ABIs
//   (unset)                      -> all ABIs as split APKs

def requestedAbi = System.getenv("BUILD_ABI")?.trim()

def allAbis       = ["arm64-v8a", "armeabi-v7a", "x86", "x86_64"]
def universalOnly = requestedAbi == "universal"
def enableSplits  = !universalOnly

// Parse comma-separated list, or fall back to all ABIs
def abisToBuild = (!universalOnly && requestedAbi)
    ? requestedAbi.split(",").collect { it.trim() }
    : allAbis

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.co3"
    defaultConfig {
        applicationId "com.co3"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "B0.0.5"
    }

    splits {
        abi {
            enable enableSplits
            reset()
            include(*abisToBuild)
            universalApk universalOnly
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation "androidx.work:work-runtime:2.9.0"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
